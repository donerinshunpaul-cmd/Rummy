<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Rummy Room</title>
<meta name="theme-color" content="#0d3b2a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rummy Room">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>
:root{
  --felt:#11553b; --felt2:#0a3324; --ink:#f3efe4; --muted:#a9c2b5; --gold:#f2c14e; --red:#d33a3a;
  --card:#fffdf7; --cardInk:#1d1d1d; --danger:#e25555; --ok:#3bbf7a;
  --cw:min(13.5vw,64px); --ch:calc(var(--cw)*1.42); --ov:.5;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
  --ease:cubic-bezier(.2,.8,.2,1);
}
@media (min-width:640px){:root{--cw:min(9vw,84px)}}
@media (min-width:1024px){:root{--cw:min(6.6vw,96px)}}
@media (min-width:640px) and (min-height:950px){:root{--cw:min(11vw,112px)}}
@media (orientation:landscape) and (max-height:500px){:root{--cw:min(6vw,50px)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:radial-gradient(ellipse at 50% 35%,var(--felt),var(--felt2) 78%) fixed;color:var(--ink);
  font:15px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans",sans-serif;overscroll-behavior:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
button{font:inherit;border:0;border-radius:12px;padding:11px 16px;background:#24614a;color:var(--ink);font-weight:600;cursor:pointer;transition:transform .12s var(--ease),filter .15s,opacity .2s}
button:hover{filter:brightness(1.12)}
button:active{transform:scale(.96)}
button:disabled{opacity:.35;pointer-events:none}
button.primary{background:var(--gold);color:#2a2100}
button.go{background:var(--ok);color:#03240f}
button.danger{background:var(--danger);color:#fff}
button.ghost{background:transparent;border:1px solid #ffffff33}
button.small{padding:8px 12px;font-size:13px;border-radius:10px}
button.seg{background:#00000040;border:1px solid #ffffff22;flex:1;padding:10px 0}
button.seg.on{background:var(--gold);color:#2a2100;border-color:var(--gold)}
input{font:inherit;padding:12px 14px;border-radius:12px;border:1px solid #ffffff33;background:#0006;color:var(--ink);width:100%;outline:none;user-select:text;-webkit-user-select:text}
input:focus{border-color:var(--gold)}
#app{min-height:100%;display:flex;flex-direction:column}
.screen{flex:1;display:flex;flex-direction:column;padding:calc(16px + var(--safe-t)) 16px calc(16px + var(--safe-b));max-width:900px;margin:0 auto;width:100%;animation:rise .35s var(--ease)}
.center{align-items:center;justify-content:center;text-align:center}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
h1{font-size:34px;margin:8px 0 2px;letter-spacing:.5px}
h2{margin:0 0 10px}
.sub{color:var(--muted);font-size:14px}
.panel{background:#00000038;border:1px solid #ffffff18;border-radius:18px;padding:16px;width:100%;max-width:420px;margin:10px auto;text-align:left}
.panel label{display:block;font-size:12px;color:var(--muted);margin:4px 0 6px;text-transform:uppercase;letter-spacing:.6px}
.row{display:flex;gap:8px;align-items:center}
.stack>*+*{margin-top:12px}
.logo{display:flex;justify-content:center;gap:0;margin-bottom:6px}
.logo .card{--cw:58px;animation:float 3s ease-in-out infinite}
.logo .card:nth-child(1){rotate:-14deg;translate:12px 6px}
.logo .card:nth-child(2){rotate:0deg;z-index:1;animation-delay:.4s}
.logo .card:nth-child(3){rotate:14deg;translate:-12px 6px;animation-delay:.8s}
@keyframes float{50%{transform:translateY(-6px)}}
.bigbtn{display:flex;align-items:center;gap:14px;width:100%;max-width:380px;padding:18px 20px;border-radius:20px;font-size:19px;text-align:left;margin:8px auto}
.bigbtn .ic{font-size:30px}
.bigbtn small{display:block;font-weight:500;font-size:13px;opacity:.75}
.corner{position:absolute;top:calc(12px + var(--safe-t));right:14px}
.code{font-size:44px;font-weight:800;letter-spacing:8px;color:var(--gold);font-family:ui-monospace,Menlo,monospace}
.plist{list-style:none;padding:0;margin:8px 0}
.plist li{display:flex;align-items:center;gap:10px;padding:9px 6px;border-bottom:1px solid #ffffff12}
.dot{width:9px;height:9px;border-radius:50%;background:#777;flex:none}.dot.on{background:var(--ok)}
.tag{font-size:11px;padding:2px 7px;border-radius:20px;background:#ffffff1c;color:var(--muted);white-space:nowrap}
.grow{flex:1}
.status{position:fixed;top:calc(var(--safe-t) + 6px);left:50%;transform:translateX(-50%);background:#000c;padding:6px 14px;border-radius:20px;font-size:13px;z-index:70;max-width:92vw;text-align:center}
.toast{position:fixed;bottom:calc(var(--safe-b) + 110px);left:50%;transform:translateX(-50%);background:#000d;padding:10px 16px;border-radius:12px;z-index:80;max-width:90vw;text-align:center;animation:toast 2.8s var(--ease) forwards;pointer-events:none}
@keyframes toast{0%{opacity:0;translate:0 10px}8%,82%{opacity:1;translate:0 0}100%{opacity:0}}

/* ---------- game ---------- */
.game{height:100vh;height:100dvh;display:flex;flex-direction:column;padding-top:var(--safe-t);max-width:1400px;margin:0 auto;width:100%}
.topbar{display:flex;align-items:center;gap:8px;padding:8px 12px;font-size:13px;color:var(--muted)}
.topbar b{color:var(--ink)}
.top{display:flex;flex-direction:column;align-items:center}
.opps{display:flex;gap:8px;overflow-x:auto;padding:4px 12px 8px;scrollbar-width:none;max-width:100%}
.opp{flex:none;min-width:92px;background:#00000040;border:2px solid transparent;border-radius:14px;padding:7px 10px;text-align:center;font-size:12px;transition:border-color .3s,box-shadow .3s,opacity .3s}
.opp .n{font-weight:700;font-size:13px;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.opp.turn{border-color:var(--gold);animation:glow 1.6s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 18px #f2c14e88}}
.opp.out{opacity:.45}
.opp .mini{display:inline-block;width:12px;height:16px;border-radius:2px;background:linear-gradient(135deg,#9d2b2b,#5e1414);border:1px solid #fff6;vertical-align:middle;margin-right:3px}
.think{display:inline-flex;gap:3px}.think i{width:4px;height:4px;border-radius:50%;background:var(--gold);animation:bl 1s infinite}.think i:nth-child(2){animation-delay:.2s}.think i:nth-child(3){animation-delay:.4s}
@keyframes bl{50%{opacity:.2}}
.table{display:flex;justify-content:center;align-items:flex-end;gap:clamp(12px,3vw,34px);padding:8px 0 4px}
.pile{position:relative;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;color:var(--muted);touch-action:none;text-align:center}
.pile .stackwrap{position:relative;width:var(--cw);height:var(--ch)}
.pile .stackwrap>.card{position:absolute;left:0;top:0}
.pile .under{rotate:-6deg;translate:-3px 2px;filter:brightness(.92)}
.pile.can{cursor:grab}
.pile.can .stackwrap{animation:bob 1.3s ease-in-out infinite}
.pile.can .stackwrap>.card:last-child{box-shadow:0 0 0 3px var(--gold),0 0 18px #f2c14e88}
@keyframes bob{50%{transform:translateY(-4px)}}
.pile.hot .stackwrap>.card:last-child,.finish.hot{box-shadow:0 0 0 4px #fff,0 0 22px #fff8}
.finish{width:var(--cw);height:var(--ch);border:2px dashed var(--ok);border-radius:calc(var(--cw)*.12);display:flex;align-items:center;justify-content:center;color:var(--ok);font-weight:700;font-size:calc(var(--cw)*.2);transition:box-shadow .2s,background .2s}
.finish.hot{background:#3bbf7a33}
.jslot .card{transform-style:preserve-3d}
.jslot.flip .card{animation:flip .7s var(--ease)}
@keyframes flip{0%{transform:rotateY(90deg) scale(1.15)}60%{transform:rotateY(-12deg) scale(1.1)}100%{transform:none}}
.tmr{display:inline-block;min-width:34px;padding:1px 7px;border-radius:10px;background:#00000055;color:var(--ink);font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.tmr.low{background:var(--danger);color:#fff;animation:pop .5s infinite alternate}
.tbar{height:4px;margin:0 auto 2px;width:min(420px,70%);background:#00000040;border-radius:4px;overflow:hidden}
.tbar i{display:block;height:100%;width:100%;background:var(--gold);transition:width .25s linear}
.tbar i.low{background:var(--danger)}
.banner{text-align:center;font-weight:700;padding:6px 10px;min-height:30px;transition:color .3s}
.banner.mine{color:var(--gold);animation:pop .4s var(--ease)}
@keyframes pop{0%{transform:scale(.92);opacity:.4}100%{transform:none;opacity:1}}
.log{text-align:center;font-size:12px;color:var(--muted);min-height:18px;padding:0 10px}
.card{position:relative;width:var(--cw);height:var(--ch);border-radius:calc(var(--cw)*.12);background:var(--card);color:var(--cardInk);
  box-shadow:0 2px 5px #0008;flex:none;font-weight:700;transition:transform .18s var(--ease),box-shadow .18s,opacity .2s}
.card .r{position:absolute;top:4%;left:7%;font-size:calc(var(--cw)*.3);line-height:1;text-align:center}
.card .big{position:absolute;bottom:4%;right:8%;font-size:calc(var(--cw)*.5);line-height:1}
.card.red{color:var(--red)}
.card.joker{background:linear-gradient(160deg,#fff7d6,#ffd86b)}
.card.joker .r{font-size:calc(var(--cw)*.17);letter-spacing:-.3px}
.card.joker .big{color:#7a5200}
.card .jk{position:absolute;top:44%;left:6%;font-size:calc(var(--cw)*.15);background:var(--gold);color:#3a2b00;border-radius:4px;padding:0 3px;line-height:1.3}
.card.back{background:repeating-linear-gradient(45deg,#8e2323 0 6px,#6d1717 6px 12px);border:3px solid #fff}
.card.back .cnt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:calc(var(--cw)*.26);text-shadow:0 1px 3px #000}
.card.closed{background:repeating-linear-gradient(-45deg,#2b4f8f 0 6px,#1d3a6e 6px 12px);border:3px solid #fff}
.card.closed .cnt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:calc(var(--cw)*.38)}
.card.sm{--cw:34px;--ch:48px}
.card.sel{transform:translateY(-16px);box-shadow:0 0 0 3px var(--gold),0 8px 12px #0009}
.card.new::after{content:"NEW";position:absolute;top:-14px;left:50%;transform:translateX(-50%);font-size:9px;color:var(--gold);font-weight:800}
.empty{width:var(--cw);height:var(--ch);border:2px dashed #ffffff40;border-radius:8px}
.hand{flex:1;min-height:0;display:flex;flex-wrap:wrap;align-content:flex-start;justify-content:center;gap:18px 12px;padding:26px 8px 10px;overflow-y:auto}
.grp{display:flex;flex-direction:column;align-items:center;border-radius:12px;padding:2px;transition:background .15s,box-shadow .15s}
.grp .cards{display:flex}
.grp .cards .card{cursor:grab;touch-action:none}
.grp .cards .card+.card{margin-left:calc(var(--cw)*-1*var(--ov))}
.grp.hot{background:#ffffff14;box-shadow:0 0 0 2px #ffffff40}
.card.ins-before{box-shadow:-5px 0 0 var(--gold),0 2px 5px #0008}
.card.ins-after{box-shadow:5px 0 0 var(--gold),0 2px 5px #0008}
.card.ghosted{opacity:.25}
.newgrp{display:none;width:calc(var(--cw)*1.1);height:var(--ch);border:2px dashed #ffffff55;border-radius:12px;align-items:center;justify-content:center;color:var(--muted);font-size:12px;text-align:center;padding:4px}
body.dragging .newgrp{display:flex}
.newgrp.hot{border-color:var(--gold);color:var(--gold);background:#f2c14e1a}
.hand.hot{background:#ffffff0c;border-radius:16px}
.glabel{margin-top:6px;font-size:11px;padding:2px 8px;border-radius:10px;background:#00000050;color:var(--muted);white-space:nowrap;transition:background .3s}
.glabel.pure,.glabel.trio{background:#1f8f5a;color:#fff}.glabel.impure{background:#2c6fb3;color:#fff}.glabel.set{background:#7a52b8;color:#fff}.glabel.invalid{background:#00000060;color:#ffb3b3}
.moveto{margin-bottom:18px;font-size:11px;padding:3px 9px;border-radius:9px;background:var(--gold);color:#2a2100;font-weight:700}
.actions{flex:none;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:10px 10px calc(10px + var(--safe-b));background:linear-gradient(transparent,#00000070 30%)}
.pts{font-size:12px;color:var(--muted);width:100%;text-align:center}
.drag-ghost{position:fixed;left:0;top:0;z-index:90;pointer-events:none;display:flex;will-change:transform;filter:drop-shadow(0 12px 14px #000a)}
.drag-ghost .card+.card{margin-left:calc(var(--cw)*-.6)}
.fly{position:fixed;z-index:85;pointer-events:none;margin:0}
.modal-bg{position:fixed;inset:0;background:#000a;z-index:60;display:flex;align-items:center;justify-content:center;padding:14px;animation:fadein .25s ease}
@keyframes fadein{from{opacity:0}}
.modal{background:#123e2e;border:1px solid #ffffff22;border-radius:18px;padding:16px;width:100%;max-width:600px;max-height:88vh;overflow-y:auto;animation:zoom .3s var(--ease)}
@keyframes zoom{from{transform:scale(.92);opacity:0}}
.res{border-bottom:1px solid #ffffff15;padding:10px 0}
.res .hd{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.gs{display:flex;flex-wrap:wrap;gap:8px}
.g{display:flex;flex-direction:column;align-items:center}
.g .cards{display:flex}.g .cards .card+.card{margin-left:-18px}
table.sc{width:100%;border-collapse:collapse;font-size:13px}table.sc td,table.sc th{padding:6px;border-bottom:1px solid #ffffff15;text-align:center}
.hint{font-size:13px;color:var(--muted)}
.rules p{margin:7px 0;font-size:14px}
@media (hover:hover){.grp .cards .card:not(.sel):hover{transform:translateY(-6px)}}
@media (min-width:900px){
  .opp{min-width:120px;padding:10px 14px;font-size:13px}.opp .n{font-size:15px}
  .table{padding:14px 0 8px}
  .banner{font-size:18px}
  .actions button.small{padding:10px 16px;font-size:14px}
  .hand{gap:22px 18px}
}
@media (orientation:landscape) and (max-height:500px){
  .topbar{padding:4px 12px}
  .top{flex-direction:row;justify-content:space-between;padding:0 env(safe-area-inset-right,0) 0 env(safe-area-inset-left,0)}
  .top .opps{flex:1;min-width:0}
  .table{padding:0 12px;gap:14px}
  .banner{min-height:0;padding:2px}.log{display:none}
  .hand{padding-top:20px;gap:12px 10px}
  .actions{padding:6px 10px calc(6px + var(--safe-b))}
  .pts{width:auto;align-self:center;margin-right:6px}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="status" class="status" hidden></div>
<div id="modal"></div>
<script src="rules.js"></script>
<script src="app.js"></script>
<script>
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
</body>
</html>
